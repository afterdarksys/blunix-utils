#!/usr/sbin/nft -f
# builder1 boot-time fallback firewall. blunix-firewall-lockdown.service loads
# this first at every boot; blunix-firewall.service then replaces it with
# nftables.conf. If that unit fails (door.nft missing or rejected, ruleset
# error), this table stays and the host is never left with no firewall.
#
# Same table and same egress as nftables.conf. The only difference is SSH:
# without a valid door set, 22/tcp is accepted from any IPv4 address,
# rate-limited (sshd is keys-only), so a broken door.nft is not a lockout.
# No include and no addresses here: nothing this file needs can be missing.

table inet blunix_host
delete table inet blunix_host

table inet blunix_host {
  # Per-source budget, so one noisy scanner cannot spend the door's share.
  # Capped: spoofed SYN sources cannot grow kernel memory without bound. A
  # full set drops new sources until entries time out (only while degraded).
  set ssh_rate_v4 {
    type ipv4_addr
    size 65536
    flags dynamic
    timeout 2m
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
    meta nfproto ipv4 tcp dport 22 ct state new update @ssh_rate_v4 { ip saddr limit rate 10/minute burst 20 packets } accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport { 53, 123 } accept
    tcp dport { 53, 80, 443 } accept
  }

  chain forward {
    type filter hook forward priority filter - 10; policy accept;
    iifname "br-blunix" udp dport 53 accept
    iifname "br-blunix" tcp dport { 53, 80, 443 } accept
    iifname "br-blunix" ct state established,related accept
    iifname "br-blunix" drop
  }
}
