# Docker's data-root is /srv/docker on the data disk. Without this, dockerd can
# start before /srv is mounted, open its state in the empty directory under the
# mount point, and lose track of networks and images (the first signed build
# failed with "network blunix-build not found" this way). With it, Docker waits
# for the mount, and a missing data disk keeps Docker down: builds fail closed.
[Unit]
RequiresMountsFor=/srv/docker
