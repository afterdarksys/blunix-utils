#!/usr/sbin/nft -f
# builder1 host firewall. Inbound: SSH from the vpscfgfarm door only.
# Docker keeps its own iptables-nft tables; this file touches only
# table inet blunix_host, so `nft -f` never flushes Docker's rules.
# The door addresses are admin IPs and this repo is public, so they live in
# /etc/blunix-builder/door.nft (pushed from the private vpscfgfarm repo):
#   define DOOR_V4 = { a.b.c.d, ... }
# install.sh --apply-firewall validates it with check-door.sh first.

include "/etc/blunix-builder/door.nft"

table inet blunix_host
delete table inet blunix_host

table inet blunix_host {
  set door_v4 {
    type ipv4_addr
    elements = $DOOR_V4
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
    tcp dport 22 ip saddr @door_v4 ct state new accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    ct state established,related accept
    oifname "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport { 53, 123 } accept
    tcp dport { 53, 80, 443 } accept
  }

  # Containers on the blunix-build network: Debian mirrors (80/443) and DNS
  # only. Applies to forwarded traffic Docker routes for the bridge.
  chain forward {
    type filter hook forward priority filter - 10; policy accept;
    iifname "br-blunix" udp dport 53 accept
    iifname "br-blunix" tcp dport { 53, 80, 443 } accept
    iifname "br-blunix" ct state established,related accept
    iifname "br-blunix" drop
  }
}
