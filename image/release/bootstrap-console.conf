# Release disk only. First boot asks at the console for the build hostname and
# the key (echo off), so the bootstrap owns tty1 until it finishes and waits
# for a person instead of timing out. getty on tty1 starts after it.
# The test disk reads a local fixture instead.
[Unit]
Before=getty@tty1.service

[Service]
StandardInput=tty
StandardOutput=tty
StandardError=journal
TTYPath=/dev/tty1
TTYVHangup=yes
TimeoutStartSec=infinity
